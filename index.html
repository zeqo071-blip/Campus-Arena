<style>

@media(max-width:860px){
.auth,.cols,.room{grid-template-columns:1fr}
.shell{grid-template-columns:1fr;padding:14px 14px 96px}
.side{position:fixed;left:0;right:0;top:auto;bottom:0;flex-direction:row;justify-content:space-around;background:var(--sf);border-top:1px solid var(--ln);padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));z-index:9;gap:2px}
.side .brand,.side .who{display:none}.nv{flex-direction:column;gap:2px;font-size:12px;padding:6px 10px}
}
.cf{position:fixed;top:-14px;width:9px;height:14px;z-index:99;animation:fall 2.2s linear forwards}@keyframes fall{to{transform:translateY(105vh) rotate(720deg)}}
.toast{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 18px;border-radius:99px;font-weight:800;z-index:100}
.rx{display:flex;gap:6px;margin-top:8px}.rx button{background:var(--sf2);padding:4px 10px;font-size:18px}
.ck{display:grid;grid-template-columns:repeat(8,1fr);width:min(100%,400px);margin:12px auto;border-radius:12px;overflow:hidden}
.ck button{aspect-ratio:1;padding:0;border-radius:0;display:grid;place-items:center;background:var(--lt,#e9d9b8)}.ck .dk2{background:var(--dk,#7a4e2d)}.ck .sl{outline:3px solid var(--gd);outline-offset:-3px}
.pc{width:76%;height:76%;border-radius:50%;display:grid;place-items:center;font-style:normal;color:#ffc233;box-shadow:inset 0 -3px 0 rgba(0,0,0,.3)}.pc.w{background:#fff}.pc.b{background:#1a1a1f}
.mm{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:340px;margin:12px auto}.mm button{aspect-ratio:1;font-size:30px;background:var(--sf2);color:var(--tx);padding:0}.mm button.up{background:var(--ln)}
.cx{display:grid;grid-template-columns:repeat(8,1fr);width:min(100%,400px);margin:12px auto;border-radius:12px;overflow:hidden}

.cp{font-style:normal;line-height:1}.cp.w{color:#fff;text-shadow:0 0 2px #000,0 0 2px #000,0 0 3px #000}.cp.b{color:#111;text-shadow:0 0 1px #fff}
.dt{display:inline-flex;border:2px solid #111;border-radius:8px;background:#fff;color:#111;font-weight:800;overflow:hidden;margin:2px}.dt b{padding:6px 9px;font-size:16px}.dt b+b{border-left:2px solid #111}.dt.pl{outline:3px solid var(--gd)}
.dtb{background:none;padding:0;border-radius:8px}.chn{display:flex;flex-wrap:wrap;gap:2px;padding:10px;background:var(--sf2);border-radius:12px;margin:8px 0;min-height:48px;align-items:center}

.how{margin-top:28px;display:grid;gap:14px}.how>div{display:flex;gap:14px;align-items:flex-start}.how b{font:700 16px Unbounded,system-ui;width:36px;height:36px;border-radius:12px;background:var(--az);color:#fff;display:grid;place-items:center;flex:none}.how h4{margin:0;font-size:15px}.how p{margin:2px 0 0}
.pod{display:flex;align-items:flex-end;justify-content:center;gap:12px;margin:18px 0}.pdm{display:flex;flex-direction:column;align-items:center;gap:4px;width:92px;min-height:var(--h);padding:12px 6px;border-radius:18px 18px 0 0;background:var(--sf);border:1px solid var(--ln);justify-content:flex-end;text-align:center}.pdm:nth-child(2){background:linear-gradient(var(--gd),var(--sf))}
.br{display:flex;gap:22px;min-width:520px}.br>div{display:flex;flex-direction:column;justify-content:space-around;gap:8px;flex:1}.bn{padding:8px 12px;border-radius:10px;background:var(--sf2);border:1px solid var(--ln);font-weight:700;font-size:14px}
.ban{height:110px;border-radius:22px}
@keyframes pin{from{opacity:0;transform:translateY(6px)}}#v>*{animation:pin .25s both}
:root{--nx:#22e1ff;--pk:#ff3dac}
:root:not([data-theme="light"]){--bg:#060919;--sf:rgba(16,22,58,.68);--sf2:rgba(36,48,108,.5);--ln:rgba(130,150,255,.22);--tx:#eef1ff;--mu:#98a4d8;--az:#7c5cff;--gr:#2df0b0;--gd:#ffd23d;--sh:0 22px 50px -26px #000}
:root:not([data-theme="light"]) body{background:radial-gradient(900px 520px at 8% -8%,rgba(124,92,255,.38),transparent 70%),radial-gradient(760px 520px at 100% 100%,rgba(34,225,255,.2),transparent 70%),radial-gradient(500px 400px at 92% 8%,rgba(255,61,172,.14),transparent 70%),var(--bg);background-attachment:fixed}
:root:not([data-theme="light"]) .auth h1{background:linear-gradient(90deg,#fff,#b9c6ff 45%,var(--nx));-webkit-background-clip:text;background-clip:text;color:transparent}
*{scrollbar-width:thin;scrollbar-color:var(--ln) transparent}option{background:#101638;color:#eef1ff}
button:not([class]),button.big{background:linear-gradient(135deg,var(--az),color-mix(in srgb,var(--az) 50%,var(--pk)));box-shadow:0 10px 24px -12px var(--az)}
button:not([class]):hover,button.big:hover{box-shadow:0 12px 30px -8px var(--az)}
input:focus,select:focus{border-color:var(--az);box-shadow:0 0 0 3px color-mix(in srgb,var(--az) 30%,transparent);outline:0}
.brand{text-shadow:0 0 18px var(--az)}.mk{filter:drop-shadow(0 0 8px var(--az))}
.sec,.form,.pv{backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.form{border-color:color-mix(in srgb,var(--az) 55%,transparent);box-shadow:0 0 70px -24px var(--az)}
.side{backdrop-filter:blur(16px)}
.nv:hover{color:var(--tx)}.nv.on{background:linear-gradient(90deg,color-mix(in srgb,var(--az) 35%,transparent),transparent);box-shadow:inset 3px 0 0 var(--az);color:var(--tx)}
.deck{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0}
.deck span{width:78px;height:96px;display:grid;place-items:center;font-size:38px;border-radius:20px;color:#fff;background:linear-gradient(160deg,color-mix(in srgb,var(--az) 45%,transparent),rgba(34,225,255,.1));border:1px solid var(--ln);box-shadow:0 0 30px -8px var(--az);animation:fl 5s ease-in-out infinite}
.deck span:nth-child(1){transform:rotate(-6deg)}.deck span:nth-child(2){transform:rotate(4deg);animation-delay:-1.3s}.deck span:nth-child(3){transform:rotate(-3deg);animation-delay:-2.6s}.deck span:nth-child(4){transform:rotate(7deg);animation-delay:-3.9s}
@keyframes fl{50%{translate:0 -10px}}
.pv{margin-top:18px;padding:14px;border-radius:20px;background:var(--sf);border:1px solid var(--ln);max-width:470px}.pvh{font-weight:800;font-size:13px;margin-bottom:6px;color:var(--mu)}
.live{display:inline-flex;align-items:center;gap:8px;padding:6px 14px;border-radius:99px;background:var(--sf);border:1px solid var(--ln);font-weight:800;font-size:13px;margin-bottom:12px}
.dot{animation:pl 1.8s infinite}@keyframes pl{0%{box-shadow:0 0 0 0 var(--gr)}70%,100%{box-shadow:0 0 0 7px transparent}}

.gt:hover:not(.off){transform:translateY(-6px) scale(1.02);box-shadow:0 28px 50px -16px var(--az),inset 0 1px 0 rgba(255,255,255,.4)}
.gt::after{content:"";position:absolute;inset:0;background:linear-gradient(120deg,transparent 40%,rgba(255,255,255,.25) 50%,transparent 60%);transform:translateX(-120%);transition:transform .7s;pointer-events:none}.gt:hover::after{transform:translateX(120%)}
.gl{font-size:72px;filter:drop-shadow(0 0 14px rgba(255,255,255,.55))}

.ln{display:flex;gap:8px;align-items:flex-end;margin:6px 0}.ln.me{justify-content:flex-end}.ln .bb{margin:0}.ln .bb.me{margin-left:0}

</style></head><body><div id="app"></div>
<script>
const U=["BDU","ADA Universiteti","UNEC","ADNSU","Azərbaycan Texniki Universiteti","Bakı Mühəndislik Universiteti","Digər"];
const M=["Kompüter elmləri","İqtisadiyyat","Hüquq","Tibb","Memarlıq","Beynəlxalq münasibətlər","Digər"];
const BOTS=[["Aysel","BDU","Hüquq"],["Elvin","ADA Universiteti","Kompüter elmləri"],["Nigar","UNEC","İqtisadiyyat"],["Rauf","BDU","Kompüter elmləri"],["Leyla","UNEC","Kompüter elmləri"],["Tural","ADNSU","Kompüter elmləri"]];
const SAY=["Salam! 👋","Kim oynayır?","Bu gün imtahan var, stres 😅","Əla gedişdir!","Növbəti oyunda görüşərik","Kim udacaq görək 😄","Hansı fakültədənsən?"];
const RK=[["BDU",2840],["UNEC",2615],["ADA Universiteti",2390],["ADNSU",1980],["ATU",1720]];
let me=null,tab="g",cur=null,ids="",chats={},friends=[],pend=[],board=Array(9).fill(""),over=false;
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
try{const s=localStorage.getItem("ca_me");if(s)me=JSON.parse(s)}catch(e){}
const opts=a=>a.map(x=>`<option>${x}</option>`).join("");
const mk='<span class="mk"><i></i><i></i><i></i><i></i></span>';
const hue=n=>[...n].reduce((a,c)=>a+c.charCodeAt(0),0)*37%360;
const av=(n,s=40)=>`<div class="av" style="width:${s}px;height:${s}px;background:hsl(${hue(n)} 65% 48%)">${esc(n[0])}</div>`;
const groups=()=>[["🏛️",me.uni+" tələbələri",me.uni],["🎓",me.major+" ixtisası",me.major],["⭐",me.uni+" / "+me.major,me.uni+me.major]];
const cnt=g=>12+BOTS.filter(b=>b[1]==g||b[2]==g||b[1]+b[2]==g).length*9;
function rank(n){return RK.slice(0,n).map((u,i)=>`<div class="rk ${me&&me.uni.startsWith(u[0])?"mine":""}"><span class="rn">${i+1}</span><div class="rb"><div class="rt"><b>${u[0]}</b><span>${u[1]} xal</span></div><div class="bar"><i data-w="${u[1]/28.4}"></i></div></div></div>`).join("")}
function anim(){requestAnimationFrame(()=>requestAnimationFrame(()=>document.querySelectorAll(".bar i").forEach(e=>e.style.width=e.dataset.w+"%")))}

function render(){
  if(!me){$("#app").innerHTML=`<div class="auth"><div><div class="brand" style="padding:0">${mk}Campus Arena</div>
  <h1>Dərsdən sonra meydan sənindir.</h1><p class="lead">Tələbə biletinlə daxil ol, universitetinin və ixtisasının qruplarına qoşul, domino, şahmat və dama ilə yoldaşlarına meydan oxu.</p>
  <div class="deck"><span>♞</span><span>🎲</span><span>🏆</span><span>✕○</span></div><div class="pv"><div class="pvh"><i class="dot"></i>Canlı çat: UNEC / Kompüter elmləri</div><div class="bb"><small>Leyla</small>Kim şahmat oynayır? ♟️</div><div class="bb me">Mən! 5 dəqiqəyə otaq açıram 🔥</div><div class="bb"><small>Rauf</small>Qoşuluram, bu dəfə udacağam 😄</div><div class="ty"><i></i><i></i><i></i></div></div><div style="margin-top:26px"><h3>Bu həftənin universitet reytinqi</h3>${rank(4)}</div>${how()}</div>

function ddraw(){if(dov||dtn!="p"||P.some(canP))return;if(Y.length)P.push(Y.pop());else{pas++;if(pas>=2)return dend();dtn="b";setTimeout(dbot,600)}drawO()}
const tl=(t,c)=>`<span class="dt ${c||""}"><b>${t[0]}</b><b>${t[1]}</b></span>`;
function drawO(){const b=$("#b");if(!b||!b.classList.contains("dg"))return;const my=dtn=="p"&&!dov;b.innerHTML=`<div class="mu">Botun daşı: ${B.length}. Qalan daş: ${Y.length}</div><div class="chn">${DC.length?DC.map(t=>tl(t)).join(""):'<span class="mu">İlk daşı sən qoy</span>'}</div><div class="mu">Sənin daşların</div><div>${P.map((t,i)=>`<button class="dtb" onclick="dp(${i})" ${canP(t)&&my?"":"disabled"} aria-label="Daş ${t[0]} ${t[1]}">${tl(t,canP(t)&&my?"pl":"")}</button>`).join("")}</div><p><button onclick="ddraw()" ${my?"":"disabled"}>Daş çək / Pas</button></p>`;const s=$("#st");if(s&&!dov)s.textContent=my?"Sənin növbən":"Botun növbəsi"}
let rf=1,ssn=0,bt="Ağac";const TY={};
const UT={"BDU":"#2f6bff","ADA Universiteti":"#e0245e","UNEC":"#0fae7c","ADNSU":"#f2a900","Azərbaycan Texniki Universiteti":"#7c3aed","Bakı Mühəndislik Universiteti":"#0891b2"};
function uniTheme(u){if(!ssn)document.documentElement.style.setProperty("--az",UT[u]||"#2f6bff")}
function season(){ssn=!ssn;const s=document.documentElement.style;if(ssn){s.setProperty("--az","#1e9e5a");s.setProperty("--gd","#ffcc33");toast("🌸 Novruz teması")}else{s.removeProperty("--gd");uniTheme(me.uni)}}
const BT={"Ağac":["#e9d9b8","#7a4e2d"],"Mərmər":["#eceff4","#8a93a8"],"Neon":["#151a3d","#2b3a9c"]};
function boardTheme(n){bt=n;const s=document.documentElement.style;s.setProperty("--lt",BT[n][0]);s.setProperty("--dk",BT[n][1])}
function stp(n){if(n>0&&!$("#n").value.trim()){toast("Adını və soyadını yaz");return}document.querySelectorAll(".stp").forEach((e,i)=>e.classList.toggle("on",i==n));document.querySelectorAll(".prog i").forEach((e,i)=>e.classList.toggle("on",i<=n))}
const how=()=>`<div class="how">${[["1","Tələbə biletini yüklə","Universitetin və ixtisasın qeyd olunur."],["2","Qruplara qoşul","Universitet və ixtisas qruplarına avtomatik düşürsən."],["3","Oyna və yüksəl","Domino, şahmat, dama və yaddaş oyunları ilə reytinqdə irəlilə."]].map(s=>`<div><b>${s[0]}</b><div><h4>${s[1]}</h4><p class="mu">${s[2]}</p></div></div>`).join("")}</div>`;
function lead(){const f=[["Həftə",.2],["Ay",.6],["Ümumi",1]];const L=[["Aysel",1840],["Elvin",1720],["Rauf",1510],["Leyla",1390],["Nigar",1260],["Tural",1100],[me.name,xp*10]].map(x=>[x[0],Math.round(x[1]*rf)]).sort((a,b)=>b[1]-a[1]);
 const pd=[1,0,2].map(i=>`<div class="pdm" style="--h:${[150,110,80][i]}px">${av(L[i][0],46)}<b>${esc(L[i][0].split(" ")[0])}</b><span>${["🥇","🥈","🥉"][i]} ${L[i][1]}</span></div>`).join("");
 return `<h2 class="hi">Liderlər cədvəli</h2><div style="display:flex;gap:8px">${f.map(x=>`<button class="${rf==x[1]?"":"gh"}" style="margin:0" onclick="rf=${x[1]};view()">${x[0]}</button>`).join("")}</div><div class="pod">${pd}</div><div class="sec">${L.slice(3).map((p,i)=>`<div class="row"><span class="rn">${i+4}</span>${av(p[0],36)}<div class="g"><b>${esc(p[0])}</b></div><b>${p[1]}</b></div>`).join("")}</div>`}
function brk(){const R=[["Aysel","Tural","Elvin","Leyla","Rauf","Nigar","Ali","Gülnar"],["Aysel","Elvin","Rauf","Ali"],["Aysel","Rauf"],["Aysel"]];return `<div class="sec" style="margin-top:20px;overflow-x:auto"><h3>Turnir: Payız kuboku</h3><div class="br">${R.map(c=>`<div>${c.map(n=>`<span class="bn">${n}</span>`).join("")}</div>`).join("")}</div><p><button onclick="toast('Turnir qeydiyyatı tezliklə açılır')">Turnirə yaz</button></p></div>`}
function prof(n){const b=BOTS.find(x=>x[0]==n),s=hue(n)%7+3;return `<div class="ban" style="background:linear-gradient(120deg,hsl(${hue(n)} 70% 45%),hsl(${hue(n)+60} 70% 35%))"></div><div class="sec" style="margin-top:-24px;position:relative"><div style="display:flex;gap:14px;align-items:center">${av(n,72)}<div><h2 style="font-size:20px">${n}</h2><span class="mu">${b[1]}, ${b[2]}</span></div></div><p>${["🏅 İlk qələbə","🔥 7 günlük seriya","🧠 Yaddaş ustası"].map(x=>`<span class="badge">${x}</span>`).join(" ")}</p><div style="display:flex;gap:28px;margin:10px 0">${[["Oyun",s*13],["Qələbə",s*8],["Faiz",55+s*3+"%"]].map(x=>`<div><h3>${x[1]}</h3><span class="mu">${x[0]}</span></div>`).join("")}</div>${friends.includes(n)?`<button onclick="cur='dm:${n}';chats[cur]=chats[cur]||[];view()">Mesaj yaz</button>`:`<button onclick="addF('${n}');toast('Dostluq göndərildi')">Dostluq at</button>`}</div>`}
render();
</script></body></html>
